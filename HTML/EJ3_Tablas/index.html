<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario, Ejercicio3</title>
</head>

<body>

    <header>
        <h1>Formulario Ejercicio3</h1>
    </header>

    <main>
        <form action="RespuestasForm.html" method="get">

            <fieldset>
                <legend>Datos personales</legend>

                <p>
                    <label for="NombreUsuario">Nombre de usuario:</label><br>
                    <input type="text" id="NombreUsuario" name="NombreUsuario" placeholder="Escriba su usuario">
                </p>

                <p>
                    <label for="contrasena">Contraseña:</label><br>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese una contraseña">
                </p>

                <input type="hidden" name="origen" value="contrasenawed">

                <p>
                    Sexo:<br>
                    <input type="radio" id="sexo_m" name="sexo" value="Masculino">
                    <label for="sexo_m">Masculino</label>

                    <input type="radio" id="sexo_f" name="sexo" value="Femenino">
                    <label for="sexo_f">Femenino</label>
                    <input type="radio" id="sexo_N" name="sexo" value="NoBinario">
                    <label for="sexo_N">No Binario</label>
                </p>
                <p>
                    <label for="pais">Estado Civil:</label><br>
                    <select id="pais" name="pais">
                        <option value="">Seleccione una opcion</option>
                        <option value="Soltero">Soltero</option>
                        <option value="Casado">Casado</option>
                        <option value="Divorciado">Divorciado</option>
                        <option value="Viudo">Viudo</option>
                    </select>
                </p>

                <p>
                    <label for="fecha_nac">Fecha de nacimiento:</label><br>
                    <input type="date" id="fecha_nac" name="fecha_nac">
                </p>

                <p>
                    <label for="hora_pref">Hora del Registro:</label><br>
                    <input type="time" id="hora_pref" name="hora_pref">
                </p>

                <p>
                    <label for="color_fav">Color favorito:</label><br>
                    <input type="color" id="color_fav" name="color_fav" value="#3366ff">
                </p>


                <p>
                    Intereses musicales:<br>
                    <input type="checkbox" id="int_prog" name="intereses" value="Programacion">
                    <label for="int_prog">Rock Nacional</label>

                    <input type="checkbox" id="int_redes" name="intereses" value="Redes">
                    <label for="int_redes">Bachata</label>

                    <input type="checkbox" id="int_bd" name="intereses" value="Bases de datos">
                    <label for="int_bd">Jazz</label>

                    <input type="checkbox" id="int_seg" name="intereses" value="Seguridad">
                    <label for="int_seg">Tango</label>
                </p>

            </fieldset>

            <fieldset>
                <legend>Datos Personales con Validación</legend>

                <p>
                    <label for="NombreCompleto ">Nombre Completo (Obligatorio):</label><br>
                    <input type="text" id="NombreCompleto " name="NombreCompleto " required
                        placeholder="Escriba su nombre completo">
                </p>

                <p>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </p>

                <p>
                    <label for="edad">Edad :</label><br>
                    <input type="number" id="edad" name="edad" step="1" min="0" placeholder="Ej: 25" required>
                </p>


                <p>
                    <label for="sitio_web">Dirreccion de su GitHub (URL):</label><br>
                    <input type="url" id="sitio_web" name="sitio_web" placeholder="http://www.github.com/Usuario"
                        required>
                </p>
                <p>
                    <label for="telefono">Teléfono:</label><br>
                    <input type="tel" id="telefono" name="telefono" pattern="\(\+54\) \d{3} \d{8}"
                        placeholder="(+54) 011 22334455" title="Formato requerido: (+54) 011 22334455" required>
                </p>
            </fieldset>

            <p>
                <button type="submit">Enviar</button>
                <button type="reset">Resetear</button>
            </p>

        </form>
    </main>

</body>

</html>
