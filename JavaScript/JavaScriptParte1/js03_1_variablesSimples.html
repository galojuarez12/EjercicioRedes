<!DOCTYPE html>
<!--
Ejercicio js03_1_variablesSimples
Objetivo: repasar declaración de variables (var / let), tipado dinámico y
coerción de tipos (tema explicado en jsParte1.pdf: "Java script es de
tipado débil... por ejemplo si a=1 y b="1" a+b es permitida dando como
resultado una concatenación a+b=11").

Botones (igual a los del video):
 - var z;      -> declara con var y pide el valor por prompt()
 - let q;      -> declara con let y pide el valor por prompt()
 - var a=1;    -> number
 - var b="1";  -> string
 - var c=2;    -> number
 - suma1=a+b;  -> "1"+1 concatena -> "11" (string) -> confirmado en el video
 - suma2=a+c;  -> 1+2 suma numérica -> 3 (number)
Cada botón muestra "Valor de X" y "Tipo de X" (typeof) dentro del div celeste.
-->
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
<title>JS03_1_variablesSimples</title>
<style>
	body { font-family: Georgia, serif; }
	#salida {
		background-color: lightblue;
		border: 2px solid black;
		width: 90%;
		min-height: 150px;
		padding: 10px;
	}
	button { margin-bottom: 10px; }
</style>
</head>
<body>

<button onclick="fVarZ()">var z;</button>
<button onclick="fLetQ()">let q;</button>
<button onclick="fVarA()">var a=1;</button>
<button onclick="fVarB()">var b="1";</button>
<button onclick="fVarC()">var c=2;</button>
<button onclick="fSuma1()">suma1=a+b;</button>
<button onclick="fSuma2()">suma2=a+c;</button>

<div id="salida"></div>

<script type="text/javascript">

	var a, b, c;

	function mostrar(nombre, valor) {
		document.getElementById("salida").innerHTML =
			"<h2>Valor de " + nombre + ": " + valor + "</h2>" +
			"<h2>Tipo de " + nombre + ": " + typeof valor + "</h2>";
	}

	function fVarZ() {
		var z;
		z = prompt("Ingrese un valor para la variable z");
		mostrar("z", z);
	}

	function fLetQ() {
		let q;
		q = prompt("Ingrese un valor para la variable q");
		mostrar("q", q);
	}

	function fVarA() {
		a = 1;
		mostrar("a", a);
	}

	function fVarB() {
		b = "1";
		mostrar("b", b);
	}

	function fVarC() {
		c = 2;
		mostrar("c", c);
	}

	function fSuma1() {
		// "1" (string) + 1 (number) => coerción de tipos: concatena => "11"
		var suma1 = a + b;
		mostrar("suma1", suma1);
	}

	function fSuma2() {
		// 1 (number) + 2 (number) => suma aritmética => 3
		var suma2 = a + c;
		mostrar("suma2", suma2);
	}

</script>

</body>
</html>
