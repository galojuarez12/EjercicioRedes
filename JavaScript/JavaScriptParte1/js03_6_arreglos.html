<!DOCTYPE html>
<!--
Ejercicio js03_6_arreglos
Objetivo: trabajar con arreglos (arrays) de índice numérico, tal como se
explica en jsParte1.pdf:

	var arregloFrutas = [];
	arregloFrutas = ["banana","manzana"];
	arregloFrutas.push(prompt("Ingresar valor para nuevo elemento"));

Salida confirmada en el video:
"Variables Multidimensionales"
"Array de indice numerico"
"Tipo para arregloFrutas: object"
"Primer elemento cargado desde programa: banana"
"Segundo elemento cargado desde programa: manzana"
"Tercer elemento cargado desde teclado: <lo que tipee el usuario>"
"Cantidad de elementos: 3"
-->
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
<title>JS03_arreglos.html</title>
</head>
<body>

<h1>Variables Multidimensionales</h1>
<h2>Array de indice numerico</h2>

<script type="text/javascript">

	// Declaración de un arreglo vacío (su tipo, como el de cualquier
	// objeto/array en JS, es "object")
	var arregloFrutas = [];

	// Carga de los dos primeros elementos, asignados por el programa
	arregloFrutas = ["banana", "manzana"];

	// El método push agrega un nuevo elemento al final del arreglo.
	// En este caso el valor lo ingresa el usuario por teclado (prompt).
	arregloFrutas.push(prompt("Ingresar valor para el nuevo elemento"));

	document.write("<h2>Tipo para arregloFrutas: " + typeof arregloFrutas + "</h2>");
	document.write("<h2>Primer elemento cargado desde programa: " + arregloFrutas[0] + "</h2>");
	document.write("<h2>Segundo elemento cargado desde programa: " + arregloFrutas[1] + "</h2>");
	document.write("<h2>Tercer elemento cargado desde teclado: " + arregloFrutas[2] + "</h2>");
	document.write("<h2>Cantidad de elementos: " + arregloFrutas.length + "</h2>");

</script>

</body>
</html>
