<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>js05_4_traduccion</title>

  <!--
  CONSIGNA (reconstruida a partir de lo visto en el video):
  Mostrar un título en la página. El texto debe aparecer en español
  ("Aprendé a estudiar en serio") o en inglés ("Learn to study seriously")
  según el idioma configurado en el navegador del usuario.

  En el video se ve como el profesor entra a la configuración de idiomas
  de Chrome (chrome://settings/languages), cambia el orden de los idiomas
  preferidos (pone "inglés" primero) y al recargar la página el texto
  cambia de español a inglés. Esto se corresponde con el objeto del BOM
  window.navigator.languages, documentado en el apunte de JS parte 2:

      window.navigator.languages[0]  -> primer idioma declarado (string)
      stringOriginal.substr(0, 2)    -> toma los 2 primeros caracteres,
                                         ej: "es_ES" -> "es"

  NOTA: La estructura de datos "textos" (diccionario es/en) y el idioma
  por defecto (español) en caso de no reconocer el idioma del navegador
  son agregados míos, ya que el video no muestra el código fuente, solo
  el comportamiento en el navegador.
-->

  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      margin-top: 120px;
    }

    #tituloGrande {
      font-size: 48px;
    }

    #tituloChico {
      font-size: 22px;
    }
  </style>
</head>

<body>

  <h1>
    <span id="tituloGrande"></span>
    <span id="tituloChico"></span>
  </h1>

  <script>
    /* Los objetos del BOM (según apunte jsParte2):
       window.navigator.languages es un array con los idiomas declarados
       en el navegador. El primer elemento [0] es el idioma por defecto. */
    let idiomaCompleto = window.navigator.languages[0];

    /* Función substr para quedarnos solo con los 2 primeros caracteres
       (ej: "es-ES" -> "es", "en-US" -> "en") tal como se explica en el
       apunte: stringOriginal.substr(0, 2) */
    let idioma = idiomaCompleto.substr(0, 2);

    /* Diccionario de textos por idioma.
       (Agregado mío: estructura de datos tipo objeto para no repetir
       código por cada idioma soportado) */
    let textos = {
      es: { grande: "Aprendé a", chico: "estudiar en serio" },
      en: { grande: "Learn to", chico: "study seriously" }
    };

    /* Si el idioma detectado no está entre los soportados, se usa
       español como idioma por defecto. (Agregado mío, no mostrado en
       el video) */



  </script>

</body>

</html>
