<!DOCTYPE html>
<!--
Página de respuesta a la que apunta el atributo "action" del formulario de
js05_3_form_confirmacion.html. En el video se ve, tras enviar el formulario,
una página titulada "Respuesta a formulario" que muestra los datos recibidos
(viajan en la URL porque el formulario usa method="get").
-->
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
<title>Respuesta a formulario</title>
</head>
<body>

<h1>Respuesta a formulario</h1>
<div id="salida"></div>

<script type="text/javascript">
	// Como el formulario usa method="get", los datos viajan como
	// parámetros dentro de la URL (location.search), por ejemplo:
	// ?nombre=Gus&apellido=Witt
	var parametros = new URLSearchParams(location.search);
	var nombre = parametros.get("nombre") || "";
	var apellido = parametros.get("apellido") || "";

	document.getElementById("salida").innerHTML =
		"<h2>Nombre recibido: " + nombre + "</h2>" +
		"<h2>Apellido recibido: " + apellido + "</h2>";
</script>

</body>
</html>
