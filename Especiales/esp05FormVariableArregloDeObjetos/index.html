<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario en Ventana Modal</title>

    <!-- Carga libreria jQuery -->
    <!-- Requisito de ejemplo -->
    <script src="../jquery.js"></script>

    <!-- Carga datos familias -->
    <!-- Archivo compartido del curso -->
    <script src="../familias.json"></script>

    <style>
        <style>

        /* Reset de cajas */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #encabezado,
        #pie {
            background-color: #edf581;
            text-align: center;
            padding: 20px 0;
        }

        #cuerpo {
            background-color: #9da6f1;
            padding: 30px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 60px;
            flex: 1;

        }

        .campo label {
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 15px;
            font-size: 30px;
        }

        #btEnviar {
            padding: 12px 0;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }

        
        @media (max-width: 768px) {
            #cuerpo {
                grid-template-columns: 1fr;
                
                gap: 20px;
                padding: 20px;
            }
        }
    </style>

    </style>
</head>

<body>

    <div id="encabezado">
        <h2>Formulario para ALTA<br>Agregar Libro</h2>
    </div>

    <form id="formLibro" action="../respuesta.html" method="get">
        <div id="cuerpo">
            <div class="campo">
                <label for="ISBN">ISBN:</label>
                <input type="text" id="ISBN" name="ISBN">
            </div>

            <div class="campo">
                <label for="selectFamilia">Genero Literario:</label>
                <select id="selectFamilia" name="selectFamilia" required>
                </select>
            </div>

            <div class="campo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo">
            </div>

            <div class="campo">
                <label for="fechaAlta">Fecha Alta:</label>
                <input type="date" id="fechaAlta" name="fechaAlta">
            </div>

            <div class="campo">
                <label for="precio">Precio:</label>
                <input type="number" id="precio" name="precio" value="0">
            </div>

            <div class="campo" style="align-self:end;">
                <button id="btEnviar" type="submit">ENVIAR</button>
            </div>
        </div>
    </form>

    <div id="pie">
        <h3>Biblbioteca UB</h3>
    </div>

    <script>
        
          
        
        // Parsea JSON a objeto

        $(document).ready(function () {
            creaOpcionesFamilia();
        });

        function creaOpcionesFamilia() {
            // Parsea JSON
            const objJson = JSON.parse(textoJSONFamilias);

            // Recorre familias
            objJson.familias.forEach(function (argValor, argIndice) {
                // Crea opcion
                let objOpcion = document.createElement("option");
                objOpcion.setAttribute("value", argValor.codFamilia);
                objOpcion.innerHTML = argValor.descFamilia;
                document.getElementById("selectFamilia").appendChild(objOpcion);
            });
        }

        
        
        
    </script>

</body>

</html>
