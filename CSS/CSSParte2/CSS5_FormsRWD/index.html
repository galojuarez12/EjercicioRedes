<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ejercicio 5 - Formulario RWD</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      background-color: #6b7280;
    }

    header.tituloForm {
      background-color: #128a8a;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    form {
      height: auto;
      width: 100%;
      overflow: auto;
      background-color: #9aa1ab;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .entrada {
      text-align: left;
      height: 130px;
      float: left;
      border-style: solid;
      border-color: gray;
      border-width: 1px;
      padding: 1%;
      width: 33.33%;
    }

    .entrada.vacio {
      display: flex;
      align-items: center;
    }

    .entrada.vacio span {
      font-weight: bold;
      font-size: 1.1rem;
    }

    input[type="text"],
    input[type="password"],
    input[type="date"],
    select {
      width: 90%;
      padding: 5px;
    }

    input[disabled] {
      background-color: #ddd;
    }

    div.barraControl {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      width: 100%;
      background-color: #6b7280;
      padding: 20px 0;
      clear: both;
    }

    .boton {
      width: 30%;
      height: 45px;
      background-color: #b7bcc4;
      cursor: pointer;
      font-size: 1rem;
      border: 1px solid #777;
    }

    footer.pieForm {
      background-color: #128a8a;
      color: white;
      text-align: center;
      padding: 15px 0;
      clear: both;
    }

    @media (min-width: 1280px) {
      .entrada {
        width: 20%;
      }
    }

    @media (min-width: 900px) and (max-width: 1279px) {
      .entrada {
        width: 25%;
      }
    }

    @media (max-width: 599px) {
      .entrada {
        width: 100%;
        float: none;
      }
    }
  </style>
</head>

<body>

  <header class="tituloForm">
    <h1>Formulario</h1>
  </header>

  <form>
    <div class="entrada"><label>1 Apellido:</label><input type="text"></div>
    <div class="entrada"><label>2 Nombres:</label><input type="text"></div>
    <div class="entrada"><label>3 Contraseña:</label><input type="password"></div>
    <div class="entrada"><label>4 Campo deshabilitado:</label><input type="text" value="valor deshabilitado" disabled>
    </div>
    <div class="entrada"><label>5 Fecha</label><input type="date"></div>

    <div class="entrada"><label>6 DNI:</label><input type="text"></div>
    <div class="entrada">
      <label>7 Actividades extracurriculares</label>
      Musica: <input type="checkbox"><br>
      Pintura artistica: <input type="checkbox">
    </div>
    <div class="entrada">
      <label>8 Sexo:</label>
      Masculino: <input type="radio" name="sexo" checked><br>
      Femenino: <input type="radio" name="sexo">
    </div>
    <div class="entrada">
      <label>9 Estado Civil</label>
      <select>
        <option>Soltero</option>
        <option>Casado</option>
        <option>Divorciado</option>
      </select>
    </div>
    <div class="entrada">
      <label>10 Estudios cursados</label>
      <select>
        <option>Primarios</option>
        <option>Secundarios</option>
        <option>Terciarios</option>
        <option>Universitarios</option>
      </select>
    </div>

    <div class="entrada">
      <label>11 Area de desempeño</label>
      <select>
        <option>Administración</option>
        <option>Ventas</option>
        <option>Producción</option>
      </select>
    </div>
    <div class="entrada">
      <label>12 Turno</label>
      <select>
        <option>Mañana</option>
        <option>Tarde</option>
        <option>Noche</option>
      </select>
    </div>
    <div class="entrada">
      <label>13 Conduce</label>
      SI <input type="radio" name="conduce" checked>
      No <input type="radio" name="conduce">
    </div>

    <div class="barraControl">
      <button type="submit" class="boton">Enviar</button>
      <button type="reset" class="boton">Reset</button>
    </div>
  </form>

  <footer class="pieForm">
    <h2>Pie de formulario</h2>
  </footer>

</body>

</html>
