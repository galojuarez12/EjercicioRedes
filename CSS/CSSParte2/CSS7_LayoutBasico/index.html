<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ejercicio 7 - Maquetación básica</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      height: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
    }

    header {
      width: 100%;
      background-color: #808080;
      color: #1c1c1c;
      padding: 20px;
      font-weight: bold;
      font-size: 1.3rem;
    }

    .contenedorNavMain {
      display: block;
      width: 100%;
      min-height: 600px;
      overflow: hidden;
    }

    nav {
      float: left;
      width: 20%;
      background-color: #f28b7a;
      min-height: 600px;
      padding: 20px;
      text-align: center;
    }

    nav h2 {
      margin-top: 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      background-color: #cfcfcf;
      margin-bottom: 8px;
    }

    nav ul li a {
      display: block;
      padding: 12px 0;
      text-decoration: none;
      color: #1c1c1c;
      font-weight: bold;
    }

    nav ul li a:hover {
      background-color: #bebebe;
      color: #2e518b;
    }

    main {
      float: left;
      width: 80%;
      background-color: #eceef1;
      min-height: 600px;
      padding: 0;
    }

    main iframe {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }

    footer {
      width: 100%;
      background-color: #808080;
      color: white;
      text-align: center;
      padding: 20px;
      clear: both;
    }
  </style>
</head>

<body>

  <header>Títulos principal de página 1</header>

  <div class="contenedorNavMain">
    <nav>
      <h2>Menu</h2>
      <ul>
        <li><a href="../../../HTML/index.html" target="visorIframe">HTML</a></li>
        <li><a href="../index.html" target="visorIframe">CSS</a></li>
        <li><a href="../../../JSCRIPT/index.html" target="visorIframe">JSCRIPT</a></li>
        <li><a href="../../../ESPECIALES/index.html" target="visorIframe">ESPECIALES</a></li>
      </ul>
    </nav>

    <main>
      <iframe name="visorIframe" src="../../../HTML/index.html"></iframe>
    </main>
  </div>

  <footer>Pie de página</footer>

</body>

</html>
