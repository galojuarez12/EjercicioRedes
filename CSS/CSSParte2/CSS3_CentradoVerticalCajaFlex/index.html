<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Caja flexible (Flexbox)</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100%;
        }

        h1 {
            text-align: center;
            color: #2e518b;
        }

        .cajaFlexible {

            background-color: rgba(243, 230, 170, 0.6);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 90%;
            height: 1000px;
            margin: 0 auto;
        }

        .cajaFlexible img {
            width: 460px;
            height: 400px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div>
        <h1>Ejercicio 4 · Cajas flexibles</h1>
    </div>


    <div class="cajaFlexible">
        <img src="pikachu.jfif" alt="imagen 1">
        <img src="pikachu.jfif" alt="imagen 2">
        <img src="pikachu.jfif" alt="imagen 3">
    </div>



</body>

</html>
