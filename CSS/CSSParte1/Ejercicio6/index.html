<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio6
    </title>
    <style>
        h1 {
            text-align: center;
        }

        .cajaSinPadding {
            width: 50%;
            margin: 0 auto;
            background-color: #a9d6e8;
        }

        .cajaConPaddingSinBoxSizing {
            width: 50%;
            padding: 25px;
            margin: 0 auto;
            background-color: #b7e8a9;
        }

        .cajaConPaddingYBoxSizing {
            width: 50%;
            padding: 50px;
            box-sizing: border-box;
            margin: 0 auto;
            background-color: #f0e6b0;
        }

        p {
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>Ejercicio 6 de CSS</h1>

    <div class="cajaSinPadding">
        <p>4 Canciones de Romeo Santos:</p>
        <p>La boda</p>
        <p>El beso que no le di</p>
        <p>Eres Mia</p>
        <p>Yo quisiera</p>
    </div>

    <div class="cajaConPaddingSinBoxSizing">
        <p>4 Canciones de RadioHead</p>
        <p>No surprises</p>
        <p>Karma police</p>
        <p>Creep</p>
        <p>Pyramid Song</p>
    </div>

    <div class="cajaConPaddingYBoxSizing">
        <p>4 canciones de Michael Jackson </p>
        <p>Billie Jean</p>
        <p>Beat It</p>
        <p>Smooth Criminal</p>
        <p>Thriller</p>
    </div>

</body>

</html>
